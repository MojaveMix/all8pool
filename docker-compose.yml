services:
  db:
    image: mysql:8.0
    container_name: all8pool-db
    restart: always
    environment:
      MYSQL_DATABASE: all8pool
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: all8pool-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - DB_NAME=all8pool
      - DB_USER=root
      - DB_PASS=root
      - DB_HOST=db
      - JWT_SECRET=all8pool@@@
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: all8pool-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    command: npm run dev

volumes:
  mysql_data:
