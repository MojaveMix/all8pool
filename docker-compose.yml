services:
  db:
    image: mysql:8.0
    container_name: all8pool-db
    restart: always
    environment:
      MYSQL_DATABASE: all8pool
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: all8pool-backend
    restart: unless-stopped
    ports:
      - "8080:5000"
    environment:
      - NODE_ENV=production
      - DB_NAME=all8pool
      - DB_USER=root
      - DB_PASS=root
      - DB_HOST=db
      - JWT_SECRET=all8pool@@@
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: all8pool-frontend
    restart: unless-stopped
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://84.8.222.138:8080/api
    depends_on:
      - backend

volumes:
  mysql_data: